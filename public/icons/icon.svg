<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#0f0f12"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="url(#ringGrad)" stroke-width="4"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="#6366f1" opacity="0.18" filter="url(#glow)"/>

  <!-- Outer Glow Lightning Bolt -->
  <polygon points="278 64, 128 266, 256 266, 234 448, 384 216, 256 216, 278 64"
           fill="#6366f1" opacity="0.45" filter="url(#glow)"/>

  <!-- Sharp Main Lightning Bolt -->
  <polygon points="278 64, 128 266, 256 266, 234 448, 384 216, 256 216, 278 64"
           fill="url(#boltGrad)"/>

  <!-- High-Energy Inner Highlight Core -->
  <polygon points="274 96, 170 246, 252 246, 238 390, 342 236, 260 236, 274 96"
           fill="#ffffff" opacity="0.3"/>
</svg>
