<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DUALCORE COCKPIT | 듀얼코어 콕핏 - 수험생 지능형 생산성 OS</title>
  <meta name="theme-color" content="#09090b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="듀얼코어 콕핏" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="alternate icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="bg-zinc-950 text-zinc-100 antialiased selection:bg-indigo-500 selection:text-white overflow-x-hidden">
  <div id="root">
    <!-- React 마운트 전 즉시 표시되는 경량 로딩 화면 -->
    <div id="boot-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #09090b; color: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; gap: 16px;">
      <div style="width: 48px; height: 48px; border: 3px solid rgba(99, 102, 241, 0.2); border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
      <div style="font-weight: 800; font-size: 16px; letter-spacing: 0.05em; color: #e4e4e7;">DUALCORE COCKPIT</div>
      <div style="font-size: 12px; color: #71717a;">수험생 생산성 OS를 불러오는 중...</div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
      <script>
        // 5초 이상 마운트되지 않을 경우 캐시 리셋 안내 버튼 노출
        setTimeout(function() {
          var el = document.getElementById('boot-loader');
          if (el && !window.__COCKPIT_MOUNTED__) {
            var tip = document.createElement('div');
            tip.style.cssText = 'margin-top: 12px; font-size: 12px; color: #a1a1aa; text-align: center;';
            tip.innerHTML = '로딩이 지연되고 있나요? <button onclick="localStorage.clear(); location.reload(true);" style="margin-left: 6px; padding: 4px 10px; border-radius: 8px; background: #4f46e5; color: white; border: none; font-weight: bold; cursor: pointer;">캐시 새로고침 (Ctrl+F5)</button>';
            el.appendChild(tip);
          }
        }, 3500);
      </script>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
