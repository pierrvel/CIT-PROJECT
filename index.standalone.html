                        <span className="text-zinc-500 dark:text-zinc-400">자동 감지:</span>
                        <span className="font-semibold text-emerald-600 dark:text-emerald-400 flex items-center gap-1">
                          <span className="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500 animate-ping"></span>
                          <span>{cleanPin.length === 6 ? `${autoSyncInterval}초마다 실시간 체크 중` : 'PIN을 먼저 입력하세요'}</span>
                        </span>
                      </div>

                      <div className="flex items-center justify-between text-[11px] text-zinc-400 dark:text-zinc-500 font-mono">
                        <span>마지막 동기화:</span>
                        <span>{lastSyncedTimeStr}</span>
                      </div>
                    </div>
                  )}
                </div>

                <div className="grid grid-cols-2 gap-2 pt-1">
                  <button
                    type="button"
                    disabled={isSyncing || cleanPin.length !== 6}
                    onClick={() => pushToServer(cleanPin, false)}
                    className="py-2.5 px-3 rounded-2xl bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] disabled:opacity-50 text-white font-bold text-xs shadow-md shadow-indigo-600/25 flex items-center justify-center gap-1.5 transition-all"
                  >
                    <Icon name="upload" className="w-3.5 h-3.5" />
                    <span>{isSyncing ? '동기화 중...' : '지금 즉시 올리기'}</span>
                  </button>

                  <button
                    type="button"
                    disabled={isSyncing || cleanPin.length !== 6}
                    onClick={() => pullFromServer(cleanPin, false)}
                    className="py-2.5 px-3 rounded-2xl bg-zinc-100 hover:bg-zinc-200 dark:bg-zinc-800 dark:hover:bg-zinc-700 active:scale-[0.98] disabled:opacity-50 text-zinc-800 dark:text-zinc-100 font-bold text-xs border border-zinc-200 dark:border-zinc-700 flex items-center justify-center gap-1.5 transition-all"
                  >
                    <Icon name="download" className="w-3.5 h-3.5 text-emerald-500" />
                    <span>{isSyncing ? '동기화 중...' : '지금 즉시 가져오기'}</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* [모달 4: 배경 커스텀 모달] */}
          {/* ======================================================== */}
          {isBgModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fadeIn">
              <div className="w-full max-w-md glass-card bg-white/95 dark:bg-zinc-900/95 rounded-3xl border border-zinc-200 dark:border-zinc-800 p-6 shadow-2xl space-y-5">
                <div className="flex items-center justify-between pb-3 border-b border-zinc-200 dark:border-zinc-800">
                  <div className="flex items-center gap-2">
                    <Icon name="image" className="w-5 h-5 text-indigo-500" />
                    <h3 className="font-bold text-lg text-zinc-900 dark:text-white">배경 & 글래스 커스텀</h3>
                  </div>
                  <button type="button" onClick={() => setIsBgModalOpen(false)} className="p-1 rounded-lg text-zinc-400 hover:text-zinc-700">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-2">
                  <label className="text-xs font-semibold text-zinc-600 dark:text-zinc-400">내 사진 업로드</label>
                  <label className="flex flex-col items-center justify-center w-full h-24 border-2 border-dashed border-zinc-300 dark:border-zinc-700 rounded-xl cursor-pointer hover:border-indigo-500 bg-zinc-50/50 dark:bg-zinc-800/50">
                    <Icon name="image" className="w-6 h-6 text-zinc-400 mb-1" />
                    <span className="text-xs text-zinc-500">클릭하여 이미지 파일 선택 (.jpg, .png)</span>
                    <input
                      type="file"
                      accept="image/*"
                      onChange={(e) => {
                        const file = e.target.files[0];
                        if (file) {
                          const reader = new FileReader();
                          reader.onload = (ev) => setBgImage(ev.target.result);
                          reader.readAsDataURL(file);
                        }
                      }}
                      className="hidden"
                    />
                  </label>
                </div>

                <div className="space-y-2">
                  <label className="text-xs font-semibold text-zinc-600 dark:text-zinc-400">추천 프리셋</label>
                  <div className="grid grid-cols-2 gap-2">
                    {PRESET_WALLPAPERS.map((preset, idx) => (
                      <button
                        key={idx}
                        type="button"
                        onClick={() => setBgImage(preset.url)}
                        className="px-3 py-2 rounded-xl text-xs font-medium text-left border border-zinc-200 dark:border-zinc-700 hover:border-indigo-500 bg-zinc-100/60 dark:bg-zinc-800/60 truncate"
                      >
                        {preset.name}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="space-y-4 pt-2">
                  <div>
                    <div className="flex justify-between text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1">
                      <span>배경 어둡기 (Dim)</span>
                      <span>{Math.round(dimOpacity * 100)}%</span>
                    </div>
                    <input
                      type="range" min="0" max="0.8" step="0.05" value={dimOpacity}
                      onChange={(e) => setDimOpacity(parseFloat(e.target.value))}
                      className="w-full h-2 bg-zinc-200 dark:bg-zinc-700 rounded-lg appearance-none cursor-pointer accent-indigo-600"
                    />
                  </div>
                  <div>
                    <div className="flex justify-between text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1">
                      <span>배경 블러 (Blur)</span>
                      <span>{blurAmount}px</span>
                    </div>
                    <input
                      type="range" min="0" max="24" step="2" value={blurAmount}
                      onChange={(e) => setBlurAmount(parseInt(e.target.value))}
                      className="w-full h-2 bg-zinc-200 dark:bg-zinc-700 rounded-lg appearance-none cursor-pointer accent-indigo-600"
                    />
                  </div>
                </div>

                <div className="flex items-center justify-between pt-3 border-t border-zinc-200 dark:border-zinc-800">
                  <button
                    type="button"
                    onClick={() => { setBgImage(null); setDimOpacity(0.15); setBlurAmount(12); }}
                    className="text-xs text-rose-500 hover:underline"
                  >
                    기본 배경 초기화
                  </button>
                  <button
                    type="button"
                    onClick={() => setIsBgModalOpen(false)}
                    className="px-4 py-2 text-xs font-bold rounded-xl bg-zinc-900 dark:bg-white text-white dark:text-zinc-900"
                  >
                    완료
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* [모달 5: 새 학습 목표 등록 모달] */}
          {/* ======================================================== */}
          {newGoalModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fadeIn">
              <div className="w-full max-w-md glass-card bg-white/95 dark:bg-zinc-900/95 rounded-3xl border border-zinc-200 dark:border-zinc-800 p-6 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-zinc-200 dark:border-zinc-800 mb-4">
                  <h3 className="font-bold text-lg text-zinc-900 dark:text-white">새 학습 목표 등록</h3>
                  <button type="button" onClick={() => setNewGoalModal(false)} className="p-1 rounded-lg text-zinc-400 hover:text-zinc-700">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    if (!newGoalForm.title.trim()) return;
                    const newGoal = {
                      id: Date.now(),
                      title: newGoalForm.title.trim(),
                      unit: newGoalForm.unit,
                      totalAmount: Number(newGoalForm.totalAmount) || 100,
                      completedAmount: Number(newGoalForm.completedAmount) || 0,
                      deadline: newGoalForm.deadline,
                      dailyCap: Number(newGoalForm.dailyCap) || 15,
                      prunedAmount: 0,
                      strategyMode: 'normal',
                      lastRecordDate: '방금 등록됨'
                    };
                    setGoals(prev => [...prev, newGoal]);
                    setNewGoalModal(false);
                    setNewGoalForm({
                      title: '', unit: '문제', totalAmount: 100, completedAmount: 0,
                      deadline: new Date(Date.now() + 30 * 86400000).toISOString().split('T')[0], dailyCap: 15
                    });
                    showToast(`'${newGoal.title}' 목표가 등록되었습니다.`, 'success');
                  }}
                  className="space-y-4"
                >
                  <div>
                    <label className="text-xs font-semibold text-zinc-600 dark:text-zinc-400">교재명 또는 목표</label>
                    <input
                      type="text" required placeholder="예: 마더텅 지구과학I 기출"
                      value={newGoalForm.title}
                      onChange={(e) => setNewGoalForm({ ...newGoalForm, title: e.target.value })}
                      className="mt-1 w-full px-3.5 py-2 text-sm rounded-xl bg-white dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 text-zinc-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-semibold text-zinc-600 dark:text-zinc-400">단위</label>
                      <select
                        value={newGoalForm.unit}
                        onChange={(e) => setNewGoalForm({ ...newGoalForm, unit: e.target.value })}
                        className="mt-1 w-full px-3 py-2 text-sm rounded-xl bg-white dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 text-zinc-900 dark:text-white"
                      >
                        <option value="문제">문제</option>
                        <option value="강">강 (인강)</option>
                        <option value="쪽">쪽 (페이지)</option>
                        <option value="단계">단계</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-zinc-600 dark:text-zinc-400">마감 목표일</label>
                      <input
                        type="date" required value={newGoalForm.deadline}
                        onChange={(e) => setNewGoalForm({ ...newGoalForm, deadline: e.target.value })}
                        className="mt-1 w-full px-3.5 py-2 text-sm rounded-xl bg-white dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 text-zinc-900 dark:text-white"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-semibold text-zinc-600 dark:text-zinc-400">전체 분량</label>
                      <input
                        type="number" min="1" required value={newGoalForm.totalAmount}
                        onChange={(e) => setNewGoalForm({ ...newGoalForm, totalAmount: e.target.value })}
                        className="mt-1 w-full px-3.5 py-2 text-sm rounded-xl bg-white dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 text-zinc-900 dark:text-white"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-zinc-600 dark:text-zinc-400">현재 완료량</label>
                      <input
                        type="number" min="0" value={newGoalForm.completedAmount}
                        onChange={(e) => setNewGoalForm({ ...newGoalForm, completedAmount: e.target.value })}
                        className="mt-1 w-full px-3.5 py-2 text-sm rounded-xl bg-white dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 text-zinc-900 dark:text-white"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-xs font-semibold text-zinc-600 dark:text-zinc-400">하루 최대 소화 한도 (Daily Cap)</label>
                    <input
                      type="number" min="1" value={newGoalForm.dailyCap}
                      onChange={(e) => setNewGoalForm({ ...newGoalForm, dailyCap: e.target.value })}
                      className="mt-1 w-full px-3.5 py-2 text-sm rounded-xl bg-white dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 text-zinc-900 dark:text-white"
                    />
                  </div>

                  <div className="flex items-center justify-end gap-2 pt-3 border-t border-zinc-200 dark:border-zinc-800">
                    <button
                      type="button"
                      onClick={() => setNewGoalModal(false)}
                      className="px-4 py-2 text-xs font-semibold rounded-xl text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-800"
                    >
                      취소
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 text-xs font-bold rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white shadow-md shadow-indigo-600/20"
                    >
                      목표 추가
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="w-full py-4 text-center text-xs text-zinc-400 dark:text-zinc-600">
            DualCore Cockpit • Sequential Time Attack Exam Pacer & Real-time Auto-Sync OS
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DualCoreCockpit />);
  </script>
</body>
</html>
